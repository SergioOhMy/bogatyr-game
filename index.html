<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Битва Богатырей</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ОБЩИЙ КРАСИВЫЙ ЗАГОЛОВОК ДЛЯ ВСЕХ ФОРМ -->
    <h1 class="game-title">Битва Богатырей</h1>

    <!-- 1. ЭКРАН ВЫБОРА И СОЗДАНИЯ ПРОФИЛЯ -->
    <div id="screen-auth" class="screen" style="display: none;">
        
        <!-- Блок создания нового профиля -->
        <div id="auth-create">
            <h2>Создание профиля</h2>
            <input type="text" id="input-name" placeholder="Введите ваше имя">
            <p>Выберите ровно 3 стартовых героев:</p>
            <div id="auth-heroes-list" class="heroes-grid"></div>
            <button id="btn-create" class="primary-btn" disabled>Создать профиль</button>
            <br>
            <button id="btn-back-to-profiles" class="danger-btn" style="display: none; margin-top: 15px;">Назад к выбору</button>
        </div>

        <!-- Блок загрузки существующих профилей -->
        <div id="auth-load" style="display: none;">
            <h2>Выберите профиль:</h2>
            <div id="profiles-list" class="heroes-grid"></div>
            <div style="margin-top: 20px;">
                <button id="btn-continue" class="primary-btn" disabled>Продолжить игру</button>
                <button id="btn-delete-profile" class="danger-btn" disabled>Удалить</button>
            </div>
            <button id="btn-new-profile" style="margin-top: 20px;">+ Создать новый профиль</button>
        </div>
    </div>

    <!-- 2. ГЛАВНОЕ МЕНЮ И МАГАЗИН (Как на скриншоте) -->
    <div id="screen-menu" class="screen" style="display: none;">
        
        <!-- Новый текст с призывом -->
        <h2 class="squad-title">Собери свою дружину (Выберите 3-х героев)</h2>

        <!-- Сначала идет Ваша дружина -->
        <div id="ui-my-heroes" class="heroes-grid"></div>

        <!-- Кнопка В БОЙ теперь прямо под дружиной, как вы хотели -->
        <div class="menu-actions" style="margin-top: 20px; margin-bottom: 40px;">
            <button id="btn-battle" class="primary-btn" disabled>В бой!</button>
        </div>

        <hr style="border-color: #7f8c8d; margin-bottom: 20px;">

        <!-- Магазин и баланс вынесены ниже -->
        <h3>Магазин Героев (Баланс: <b id="ui-coins" style="color: #f1c40f;">0</b> 💰)</h3>
        <div id="ui-shop-heroes" class="heroes-grid"></div>
        
        <button id="btn-logout" class="danger-btn" style="margin-top: 30px;">Сменить профиль</button>
    </div>

    <!-- 3. ЭКРАН БОЯ -->
    <div id="screen-battle" class="screen" style="display: none;">
        <h2 id="turn-indicator">Ходит: ...</h2>
        <p>Время на ход: <span id="timer-display">60</span> сек</p>
        
        <div class="battlefield">
            <div id="player-team" class="team"></div>
            <div id="enemy-team" class="team"></div>
        </div>
        
        <div id="skills-container" class="skills"></div>
        <button id="execute-btn" disabled>Атаковать</button>
        <div id="combat-log"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
